<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>📊 Iterator - Galeria Obrazów</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 20px;
      }
      .container {
        max-width: 700px;
        margin: 0 auto;
        background: white;
        border-radius: 12px;
        padding: 30px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        text-align: center;
      }
      h1 {
        color: #333;
        margin-bottom: 20px;
      }
      .pattern-description {
        background: #f0e6ff;
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 20px;
        border-left: 4px solid #667eea;
        color: #555;
      }
      #photo-display {
        margin: 30px 0;
        min-height: 300px;
        background: #f5f5f5;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .photo-item {
        text-align: center;
      }
      .photo-item img {
        max-width: 100%;
        max-height: 350px;
        border-radius: 8px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
      }
      .photo-item h3 {
        margin-top: 15px;
        color: #333;
      }
      .counter {
        font-size: 14px;
        color: #666;
        margin-top: 10px;
      }
      .controls {
        display: flex;
        gap: 10px;
        justify-content: center;
        margin-top: 20px;
      }
      button {
        padding: 12px 24px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
      }
      button:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>📊 Iterator - Galeria Obrazów</h1>
      <div class="pattern-description">
        💡 Iterator wzorzec do sekwencyjnego dostępu do elementów kolekcji. Ukrywa wewnętrzną
        strukturę i umożliwia iterację w przód i tył.
      </div>

      <div id="photo-display"></div>

      <div class="controls">
        <button id="prev-btn">← Poprzednia</button>
        <button id="reset-btn">Pierwsza</button>
        <button id="next-btn">Następna →</button>
      </div>
    </div>
    <script type="module" src="./solution.ts"></script>
  </body>
</html>
