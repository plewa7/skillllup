<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>👁️ Visitor - Analiza Kształtów</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
        min-height: 100vh;
        padding: 20px;
      }
      .container {
        max-width: 800px;
        margin: 0 auto;
        background: white;
        border-radius: 12px;
        padding: 30px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      }
      h1 {
        color: #333;
        margin-bottom: 20px;
      }
      .pattern-description {
        background: #fff3cd;
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 20px;
        border-left: 4px solid #ffc107;
        color: #856404;
        line-height: 1.6;
      }
      .controls {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
        flex-wrap: wrap;
      }
      button {
        padding: 12px 24px;
        background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
        color: #333;
        border: none;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
      }
      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(250, 112, 154, 0.3);
      }
      #output {
        background: #f5f5f5;
        border-radius: 8px;
        padding: 20px;
        min-height: 200px;
      }
      .result-item {
        background: white;
        padding: 12px;
        margin-bottom: 10px;
        border-radius: 6px;
        border-left: 4px solid #fa709a;
        font-family: 'Courier New', monospace;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>👁️ Visitor - Analiza Kształtów</h1>
      <div class="pattern-description">
        💡 Visitor wzorzec - wykonuje operacje na kształtach bez zmiany ich klas. Nowe operacje =
        nowe Visitor klasy.
      </div>
      <div class="controls">
        <button id="area-btn">📐 Oblicz Pole</button>
        <button id="perimeter-btn">📏 Oblicz Obwód</button>
        <button id="analyze-btn">🔍 Analiza</button>
        <button id="clear-btn">🗑️ Wyczyść</button>
      </div>
      <div id="output"></div>
    </div>
    <script type="module" src="./solution.ts"></script>
  </body>
</html>
