<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🔤 Interpreter - Wyrażenia Matematyczne</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 20px;
      }
      .container {
        max-width: 800px;
        margin: 0 auto;
        background: white;
        border-radius: 12px;
        padding: 30px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      }
      h1 {
        color: #333;
        margin-bottom: 20px;
      }
      .pattern-description {
        background: #f0e6ff;
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 20px;
        border-left: 4px solid #667eea;
        color: #555;
        line-height: 1.6;
      }
      .input-group {
        display: flex;
        gap: 10px;
        margin: 20px 0;
      }
      input {
        flex: 1;
        padding: 12px;
        border: 2px solid #ddd;
        border-radius: 6px;
        font-size: 14px;
      }
      input:focus {
        outline: none;
        border-color: #667eea;
      }
      button {
        padding: 12px 24px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
      }
      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
      }
      #result {
        background: #e8f5e9;
        border: 2px solid #4caf50;
        padding: 20px;
        border-radius: 8px;
        margin: 20px 0;
        text-align: center;
        font-size: 18px;
        min-height: 60px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #history {
        max-height: 250px;
        overflow-y: auto;
        background: #f5f5f5;
        border-radius: 8px;
        padding: 15px;
      }
      .history-item {
        padding: 8px;
        margin: 5px 0;
        background: white;
        border-left: 3px solid #667eea;
        padding-left: 12px;
        font-family: 'Courier New', monospace;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🔤 Interpreter - Parser Wyrażeń Matematycznych</h1>
      <div class="pattern-description">
        💡 Interpreter wzorzec do parsowania i ewaluacji wyrażeń matematycznych. Parser buduje
        abstrakcyjne drzewo składni (AST) i interpretuje je.
      </div>

      <div class="input-group">
        <input type="text" id="expression-input" placeholder="Np: 2 + 3, 10 * 2 - 5, (3 + 5) * 2" />
        <button id="parse-btn">Oblicz</button>
        <button id="clear-btn">Wyczyść</button>
      </div>

      <div id="result"></div>

      <h3>Historia Obliczeń</h3>
      <div id="history"></div>
    </div>
    <script type="module" src="./solution.ts"></script>
  </body>
</html>
