<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>💾 Memento - Edytor Tekstu</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
        min-height: 100vh;
        padding: 20px;
      }
      .container {
        max-width: 900px;
        margin: 0 auto;
        background: white;
        border-radius: 12px;
        padding: 30px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      }
      h1 {
        color: #333;
        margin-bottom: 20px;
      }
      .pattern-description {
        background: #e0f2f1;
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 20px;
        border-left: 4px solid #00897b;
        color: #00695c;
        line-height: 1.6;
      }
      .controls {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
      }
      button {
        padding: 10px 20px;
        background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
        border: none;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
      }
      button:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      textarea {
        width: 100%;
        height: 200px;
        padding: 15px;
        border: 2px solid #ddd;
        border-radius: 8px;
        font-family: 'Courier New', monospace;
        resize: vertical;
        margin-bottom: 20px;
      }
      textarea:focus {
        outline: none;
        border-color: #00897b;
      }
      #history-list {
        background: #f5f5f5;
        border-radius: 8px;
        padding: 15px;
        max-height: 200px;
        overflow-y: auto;
      }
      .history-item {
        padding: 8px;
        margin: 5px 0;
        background: white;
        border-radius: 4px;
        display: flex;
        justify-content: space-between;
        font-size: 13px;
      }
      .history-time {
        color: #00897b;
        font-weight: 600;
      }
      .history-preview {
        color: #666;
        margin-left: 10px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>💾 Memento - Edytor Tekstu z Historią</h1>
      <div class="pattern-description">
        💡 Memento wzorzec do zapisywania i przywracania stanu edytora. Posiada funkcjonalność
        Undo/Redo.
      </div>
      <div class="controls">
        <button id="save-btn">💾 Zapisz</button>
        <button id="undo-btn">↶ Cofnij</button>
        <button id="redo-btn">↷ Ponów</button>
        <button id="clear-btn">🗑️ Wyczyść</button>
      </div>
      <textarea id="editor" placeholder="Wpisz tekst tutaj..."></textarea>
      <h3>Historia Zmian</h3>
      <div id="history-list"></div>
    </div>
    <script type="module" src="./solution.ts"></script>
  </body>
</html>
