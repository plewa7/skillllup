<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🔒 Proxy - Lazy Image</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
        min-height: 100vh;
        padding: 20px;
      }
      .container {
        max-width: 900px;
        margin: 0 auto;
        background: white;
        border-radius: 12px;
        padding: 30px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      }
      h1 {
        color: #333;
        margin-bottom: 20px;
      }
      .pattern-description {
        background: #fff3cd;
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 20px;
        border-left: 4px solid #ffc107;
        color: #856404;
        line-height: 1.6;
      }
      .controls {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
        flex-wrap: wrap;
      }
      button {
        padding: 12px 24px;
        background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
        color: #333;
        border: none;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
      }
      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(250, 112, 154, 0.3);
      }
      #gallery {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 15px;
        margin-bottom: 20px;
        min-height: 250px;
      }
      .gallery-item {
        background: #f5f5f5;
        border: 2px solid #ddd;
        border-radius: 8px;
        padding: 15px;
        text-align: center;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 200px;
      }
      .gallery-image {
        max-width: 100%;
        max-height: 150px;
        border-radius: 4px;
        margin-bottom: 10px;
      }
      .image-info {
        font-size: 12px;
        color: #666;
        font-weight: 600;
      }
      .image-box {
        background: #f5f5f5;
        border: 2px solid #ddd;
        border-radius: 8px;
        padding: 15px;
        text-align: center;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 200px;
      }
      .image-box img {
        max-width: 100%;
        max-height: 180px;
        border-radius: 6px;
      }
      #log {
        background: #f5f5f5;
        border-radius: 8px;
        padding: 15px;
        max-height: 250px;
        overflow-y: auto;
        font-family: 'Courier New', monospace;
        font-size: 13px;
      }
      .log-entry {
        padding: 8px;
        margin-bottom: 8px;
        background: white;
        border-left: 3px solid #fa709a;
        border-radius: 4px;
        animation: slideIn 0.3s ease;
      }
      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateX(-10px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🔒 Proxy - Lazy Loading Obrazu</h1>
      <div class="pattern-description">
        💡 Proxy wzorzec - odkłada ładowanie obrazów do czasu, gdy są rzeczywiście potrzebne. Oszczędza przepustowość i pamięć.
      </div>
      <div class="controls">
        <button id="proxy-btn">📦 Proxy (Lazy Loading)</button>
        <button id="direct-btn">⚡ Bezpośrednio (Eager Loading)</button>
        <button id="clear-btn">🗑️ Wyczyść Log</button>
      </div>
      <h3>Galeria</h3>
      <div id="gallery"></div>
      <h3>Log Ładowania</h3>
      <div id="log"></div>
    </div>
    <script type="module" src="./solution.ts"></script>
  </body>
</html>
</html>
