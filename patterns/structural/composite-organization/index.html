<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🌳 Composite - Organizacja</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        min-height: 100vh;
        padding: 20px;
      }
      .container {
        max-width: 900px;
        margin: 0 auto;
        background: white;
        border-radius: 12px;
        padding: 30px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      }
      h1 {
        color: #333;
        margin-bottom: 20px;
      }
      .pattern-description {
        background: #fce4ec;
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 20px;
        border-left: 4px solid #f5576c;
        color: #880e4f;
        line-height: 1.6;
      }
      .controls {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
      }
      button {
        padding: 12px 24px;
        background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        color: white;
        border: none;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
      }
      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(245, 87, 108, 0.3);
      }
      #output {
        background: #f5f5f5;
        border-radius: 8px;
        padding: 20px;
        margin-bottom: 20px;
        min-height: 250px;
      }
      #budget-info {
        background: #e8f5e9;
        border: 2px solid #4caf50;
        border-radius: 8px;
        padding: 15px;
        margin-bottom: 20px;
        font-weight: 600;
        color: #1b5e20;
        text-align: center;
        font-size: 16px;
      }
      #departments-list {
        background: #f5f5f5;
        border-radius: 8px;
        padding: 20px;
        font-family: 'Courier New', monospace;
        font-size: 13px;
        line-height: 2;
      }
      #organization-tree,
      .organization-tree {
        background: #f5f5f5;
        border-radius: 8px;
        padding: 20px;
        font-family: 'Courier New', monospace;
        font-size: 13px;
        line-height: 1.8;
        overflow-x: auto;
        min-height: 250px;
        white-space: pre;
      }
      .total-budget {
        background: #e8f5e9;
        border: 2px solid #4caf50;
        border-radius: 8px;
        padding: 15px;
        margin-top: 20px;
        font-weight: 600;
        color: #1b5e20;
        text-align: center;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🌳 Composite - Organizacja Firmy</h1>
      <div class="pattern-description">
        💡 Composite wzorzec - składa obiekty w strukturę drzewa. Pracownicy (liście) i Departamenty
        (gałęzie) mogą być traktowane jednolicie.
      </div>
      <div class="controls">
        <button id="display-btn">📊 Wyświetl Strukturę</button>
        <button id="budget-btn">💰 Pokaż Budżety</button>
        <button id="list-btn">📋 Pokaż Listę</button>
      </div>
      <div id="output"></div>
      <div id="budget-info"></div>
      <div id="departments-list"></div>
    </div>
    <script type="module" src="./solution.ts"></script>
  </body>
</html>
