<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🌉 Bridge - Pilot do Urządzeń</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 20px;
      }
      .container {
        max-width: 800px;
        margin: 0 auto;
        background: white;
        border-radius: 12px;
        padding: 30px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      }
      h1 {
        color: #333;
        margin-bottom: 20px;
      }
      .pattern-description {
        background: #f0e6ff;
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 20px;
        border-left: 4px solid #667eea;
        color: #555;
        line-height: 1.6;
      }
      .controls {
        background: #f5f5f5;
        padding: 20px;
        border-radius: 8px;
        margin-bottom: 20px;
      }
      .control-row {
        display: flex;
        gap: 15px;
        margin-bottom: 15px;
        align-items: center;
      }
      label {
        font-weight: 600;
        min-width: 100px;
      }
      select {
        padding: 10px;
        border: 2px solid #ddd;
        border-radius: 6px;
        flex: 1;
      }
      button {
        padding: 10px 20px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
      }
      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
      }
      #device-info {
        background: #e3f2fd;
        border: 2px solid #2196f3;
        border-radius: 8px;
        padding: 15px;
        margin-bottom: 20px;
        font-weight: 600;
        color: #1565c0;
      }
      #status {
        max-height: 300px;
        overflow-y: auto;
      }
      .status-message {
        padding: 10px;
        margin-bottom: 8px;
        border-radius: 6px;
        animation: slideIn 0.3s ease;
      }
      .status-message.success {
        background: #c8e6c9;
        color: #1b5e20;
        border-left: 3px solid #4caf50;
      }
      .status-message.info {
        background: #bbdefb;
        color: #0d47a1;
        border-left: 3px solid #2196f3;
      }
      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🌉 Bridge - Pilot do Urządzeń</h1>
      <div class="pattern-description">
        💡 Bridge wzorzec - oddziela abstrakcję (pilot) od implementacji (urządzenia). Zmień
        urządzenie lub pilot niezależnie.
      </div>
      <div class="controls">
        <div class="control-row">
          <label>Urządzenie:</label>
          <select id="device-select">
            <option value="tv">Telewizor</option>
            <option value="radio">Radio</option>
            <option value="lights">Światła</option>
          </select>
        </div>
        <div class="control-row">
          <label>Pilot:</label>
          <select id="remote-select">
            <option value="basic">Podstawowy</option>
            <option value="advanced">Zaawansowany</option>
          </select>
        </div>
      </div>
      <div id="device-info"></div>
      <div style="display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap">
        <button id="power-on">🔌 Włącz</button>
        <button id="power-off">⚫ Wyłącz</button>
        <button id="vol-up">🔊 Głośniej</button>
        <button id="vol-down">🔇 Ciszej</button>
      </div>
      <h3>Logi zdarzeń</h3>
      <div id="status"></div>
    </div>
    <script type="module" src="./solution.ts"></script>
  </body>
</html>
