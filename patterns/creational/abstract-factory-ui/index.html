<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🔧 Abstract Factory - UI</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 20px;
        transition: background 0.3s ease;
      }
      body.light-theme {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      }
      body.dark-theme {
        background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
      }
      .container {
        max-width: 900px;
        margin: 0 auto;
        background: white;
        border-radius: 12px;
        padding: 30px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        transition: all 0.3s ease;
      }
      .dark-theme .container {
        background: #2d2d2d;
        color: #fff;
      }
      h1 {
        color: #333;
        margin-bottom: 20px;
      }
      .dark-theme h1 {
        color: #fff;
      }
      .pattern-description {
        background: #f0e6ff;
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 20px;
        border-left: 4px solid #667eea;
        color: #555;
        line-height: 1.6;
      }
      .dark-theme .pattern-description {
        background: #444;
        color: #ccc;
        border-left-color: #764ba2;
      }
      .controls {
        display: flex;
        gap: 10px;
        margin-bottom: 30px;
      }
      button {
        padding: 12px 24px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
      }
      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
      }
      .ui-showcase {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
      }
      .component-box {
        background: #f5f5f5;
        padding: 20px;
        border-radius: 8px;
        border: 2px solid #e0e0e0;
      }
      .dark-theme .component-box {
        background: #3d3d3d;
        border-color: #555;
      }
      .component-label {
        font-weight: 600;
        margin-bottom: 12px;
        color: #666;
      }
      .dark-theme .component-label {
        color: #aaa;
      }
      .demo-button {
        display: block;
        width: 100%;
        padding: 10px;
        margin-bottom: 8px;
        background: #667eea;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-weight: 600;
      }
      .demo-button:hover {
        background: #764ba2;
      }
      .demo-input {
        width: 100%;
        padding: 8px;
        border: 2px solid #667eea;
        border-radius: 4px;
        margin-bottom: 8px;
      }
      .dark-theme .demo-input {
        background: #555;
        border-color: #764ba2;
        color: #fff;
      }
      .demo-label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: #333;
      }
      .dark-theme .demo-label {
        color: #fff;
      }
    </style>
  </head>
  <body class="light-theme">
    <div class="container">
      <h1>🔧 Abstract Factory - UI Theme Factory</h1>
      <div class="pattern-description">
        💡 Abstract Factory wzorzec - tworzy rodziny powiązanych obiektów (komponenty UI dla różnych motywów) bez określania konkretnych klas.
      </div>
      <div class="controls">
        <select id="theme-select">
          <option value="light">☀️ Jasny Motyw</option>
          <option value="dark">🌙 Ciemny Motyw</option>
        </select>
      </div>
      <div id="ui-container"></div>
    </div>
    <script type="module" src="./solution.ts"></script>
  </body>
</html>
</html>
