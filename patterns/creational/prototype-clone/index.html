<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🔬 Prototype - Clone</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
        min-height: 100vh;
        padding: 20px;
      }
      .container {
        max-width: 900px;
        margin: 0 auto;
        background: white;
        border-radius: 12px;
        padding: 30px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      }
      h1 {
        color: #333;
        margin-bottom: 20px;
      }
      .pattern-description {
        background: #e0f2f1;
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 20px;
        border-left: 4px solid #00897b;
        color: #00695c;
        line-height: 1.6;
      }
      .controls {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
        flex-wrap: wrap;
      }
      button {
        padding: 10px 20px;
        background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
        color: #333;
        border: none;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
      }
      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
      }
      .document-form {
        background: #f5f5f5;
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 20px;
      }
      .form-row {
        display: flex;
        gap: 10px;
        margin-bottom: 10px;
      }
      input, select {
        flex: 1;
        padding: 10px;
        border: 2px solid #ddd;
        border-radius: 6px;
        font-size: 13px;
      }
      input:focus, select:focus {
        outline: none;
        border-color: #00897b;
      }
      .registry {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 15px;
      }
      .document-card {
        background: white;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        padding: 12px;
        animation: slideIn 0.3s ease;
      }
      .document-title {
        font-weight: 600;
        color: #333;
        margin-bottom: 8px;
      }
      .document-info {
        font-size: 12px;
        color: #666;
        margin-bottom: 10px;
      }
      .document-buttons {
        display: flex;
        gap: 5px;
      }
      .document-buttons button {
        flex: 1;
        padding: 8px;
        font-size: 12px;
      }
      .document-item {
        background: white;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        padding: 12px;
        margin-bottom: 10px;
        animation: slideIn 0.3s ease;
      }
      .document-item.cloned {
        background: #f0f8f7;
        border-color: #00897b;
      }
      .document-header {
        font-weight: 600;
        color: #333;
        margin-bottom: 8px;
      }
      .document-actions {
        display: flex;
        gap: 8px;
        margin-top: 10px;
      }
      .document-actions button {
        flex: 1;
        padding: 6px 12px;
        font-size: 11px;
        background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
        color: #333;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .document-actions button:hover {
        transform: translateY(-1px);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      .document-details {
        background: #f5f5f5;
        padding: 12px;
        border-radius: 6px;
        margin-top: 10px;
        font-size: 12px;
      }
      .document-details h3 {
        color: #333;
        margin-bottom: 8px;
      }
      .document-details p {
        margin: 4px 0;
      }
      .tag {
        display: inline-block;
        background: #00897b;
        color: white;
        padding: 2px 8px;
        border-radius: 12px;
        font-size: 11px;
        margin-right: 4px;
      }
      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🔬 Prototype - Klonowanie Obiektów</h1>
      <div class="pattern-description">
        💡 Prototype wzorzec - tworzy obiekty poprzez klonowanie prototypu zamiast konstruowania od zera. Obsługuje klonowanie głębokie i płytkie.
      </div>
      <div class="document-form">
        <div class="form-row">
          <input type="text" id="doc-name" placeholder="Nazwa dokumentu..." />
          <input type="text" id="doc-author" placeholder="Autor..." />
          <select id="clone-type">
            <option value="deep">Klon Głęboki</option>
            <option value="shallow">Klon Płytki</option>
          </select>
          <button id="create-btn">➕ Utwórz</button>
        </div>
      </div>
      <div class="controls">
        <button id="clone-selected-btn">🔄 Klonuj Wybrane</button>
        <button id="clear-all-btn">🗑️ Wyczyść Wszystko</button>
      </div>
      <h3>Rejestr Dokumentów</h3>
      <div class="registry" id="documents-list"></div>
    </div>
    <script type="module" src="./solution.ts"></script>
  </body>
</html>
</html>
